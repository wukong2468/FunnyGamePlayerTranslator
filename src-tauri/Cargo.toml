[package]
name = "funnygameplayertranslator"
version = "1.0.0"
description = "FunnyGamePlayer 游戏文本汉化工具"
authors = ["FunnyGamePlayer"]
edition = "2024"

[lib]
# `_lib` 后缀避免 Windows 下库名与可执行文件冲突
name = "funnygameplayertranslator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# 体积优化，详见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
